name: Deploy Dev

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - dev

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'dev'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Deploy to Dev Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script: |
            if [ ! -d ~/alumnx-vector-db ]; then
              git clone https://github.com/alumnx-ai-labs/alumnx-vector-db.git ~/alumnx-vector-db
            fi
            cd ~/alumnx-vector-db
            git fetch origin
            git reset --hard origin/dev
            git clean -fd
            bash deploy.sh dev 8001 alumnx-vector-db
